# JHPATCH: the public export ships no setup action; pins Bun and Node for the fork's CI.
name: Setup
description: Install Bun, Node and the workspace.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - shell: bash
      run: bun install --frozen-lockfile
